name: diag
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: cd android && ./gradlew assembleRelease --stacktrace --warning-mode all
        continue-on-error: true

      - run: find . -name "*.apk" -type f
        if: always()

      - run: ls -la build/app/outputs/flutter-apk/ || true
        if: always()

      - run: ls -la android/app/build/outputs/apk/release/ || true
        if: always()
